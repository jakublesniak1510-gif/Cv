services:
  - type: web
    name: cv-pod-ogloszenie
    runtime: docker
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: orders
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: P24_MERCHANT_ID
        sync: false
      - key: P24_POS_ID
        sync: false
      - key: P24_CRC
        sync: false
      - key: P24_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GADS_ID
        sync: false
      - key: GADS_PURCHASE_LABEL
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CODE_SALT
        generateValue: true
      - key: ACCOUNT_SECRET
        generateValue: true
