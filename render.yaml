services:
  - type: web
    name: cv-pod-ogloszenie
    runtime: docker
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: orders
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
