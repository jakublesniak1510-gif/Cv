services:
  - type: web
    name: cv-pod-ogloszenie
    runtime: docker
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: orders
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: P24_MERCHANT_ID
        sync: false
      - key: P24_POS_ID
        sync: false
      - key: P24_CRC
        sync: false
      - key: P24_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: CODE_SALT
        sync: false
